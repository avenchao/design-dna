# Alibaba Cloud Linux 3 + existing BT Panel Nginx 1.28+.
upstream design_dna_supabase {
    zone design_dna_supabase 64k;
    resolver 223.5.5.5 119.29.29.29 valid=300s ipv6=off;
    server gqdtqyrfainiljdszznb.supabase.co:443 resolve;
    keepalive 16;
}
server {
    listen 80;
    server_name dna.avenchao.top;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/dna.avenchao.top/current;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://dna.avenchao.top$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name dna.avenchao.top;
    root /www/wwwroot/dna.avenchao.top/current;
    index index.html;
    access_log off;
    server_tokens off;
    ssl_certificate /www/server/panel/vhost/cert/dna.avenchao.top/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/dna.avenchao.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DNA_TLS:10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 16k;

    # Keep the current Token/session database. Browser requests stay same-origin.
    # Add https://dna.avenchao.top to Supabase ALLOWED_ORIGINS before enabling.
    location ^~ /api/ {
        proxy_pass https://design_dna_supabase/functions/v1/design-dna/;
        proxy_http_version 1.1;
        proxy_set_header Host gqdtqyrfainiljdszznb.supabase.co;
        proxy_set_header Connection "";
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_ssl_server_name on;
        proxy_ssl_name gqdtqyrfainiljdszznb.supabase.co;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
        proxy_ssl_verify_depth 3;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
        proxy_send_timeout 45s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
    # Compatibility with previously distributed query-string links.
    location = /play { return 308 /play/$is_args$args; }
    location ~ ^/design-dna/(.*)$ { return 308 https://dna.avenchao.top/$1$is_args$args; }
    location = /healthz { default_type text/plain; return 200 "ok\n"; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ^~ /illustrations/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { deny all; }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
    }
}
