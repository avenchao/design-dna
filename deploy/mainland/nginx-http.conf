# Bootstrap only. Replace with nginx-https.conf after obtaining the certificate.
server {
    listen 80;
    server_name dna.avenchao.top;
    root /var/www/design-dna/current;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://dna.avenchao.top$request_uri; }
}
